[build]
  publish = "."
  # الملفات جاهزة ولا تحتاج بناء عند النشر؛ أعد بناء CSS محليًا بـ: npm run build:css
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
